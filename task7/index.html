<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента постов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header class="app__header">
            <h1>Лента постов</h1>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск по заголовку...">
        </header>

        <div id="posts-list" class="posts-list"></div>

        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>

        <div id="error-message" class="error-message hidden"></div>
        <div id="end-message" class="end-message hidden">Больше постов нет</div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
