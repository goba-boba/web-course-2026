<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen-Money — Учёт финансов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header class="header">
            <div class="header__top">
                <h1>Zen-Money 💗</h1>
                <button id="theme-toggle" class="theme-toggle" title="Переключить тему">🌙</button>
            </div>
            <div class="summary">
                <div class="summary__item summary__item--income">
                    <span class="summary__label">Доходы</span>
                    <span class="summary__value" id="total-income">0 ₽</span>
                </div>
                <div class="summary__item summary__item--expense">
                    <span class="summary__label">Расходы</span>
                    <span class="summary__value" id="total-expense">0 ₽</span>
                </div>
                <div class="summary__item summary__item--balance">
                    <span class="summary__label">Баланс</span>
                    <span class="summary__value" id="total-balance">0 ₽</span>
                </div>
            </div>
        </header>

        <section class="form-section">
            <h2 id="form-title">Новая операция</h2>
            <form id="transaction-form" class="form">
                <input type="hidden" id="edit-id">

                <div class="form__row">
                    <label>
                        Сумма
                        <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" required>
                    </label>
                    <label>
                        Тип
                        <select id="type">
                            <option value="expense">Расход</option>
                            <option value="income">Доход</option>
                        </select>
                    </label>
                </div>

                <div class="form__row">
                    <label>
                        Категория
                        <select id="category" required></select>
                    </label>
                    <label>
                        Дата
                        <input type="date" id="date" required>
                    </label>
                </div>

                <label class="form__full">
                    Комментарий
                    <input type="text" id="comment" placeholder="Необязательно">
                </label>

                <p id="form-error" class="form__error hidden"></p>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary" id="submit-btn">Добавить</button>
                    <button type="button" class="btn btn--ghost hidden" id="cancel-btn">Отмена</button>
                </div>
            </form>
        </section>

        <section class="category-section">
            <h2>Своя категория</h2>
            <form id="category-form" class="category-form">
                <input type="text" id="new-category-name" placeholder="Название категории" required>
                <select id="new-category-type">
                    <option value="expense">Расход</option>
                    <option value="income">Доход</option>
                </select>
                <button type="submit" class="btn btn--primary">Создать</button>
            </form>
            <p id="category-error" class="form__error hidden"></p>
        </section>

        <section class="filters-section">
            <div class="filters-section__header">
                <h2>Фильтры</h2>
                <button id="reset-filters" class="btn btn--ghost btn--small">Сбросить</button>
            </div>
            <div class="filters">
                <label>
                    Тип
                    <select id="filter-type">
                        <option value="all">Все</option>
                        <option value="income">Только доходы</option>
                        <option value="expense">Только расходы</option>
                    </select>
                </label>
                <label>
                    Категория
                    <select id="filter-category">
                        <option value="">Все категории</option>
                    </select>
                </label>
                <label>
                    Дата с
                    <input type="date" id="filter-date-from">
                </label>
                <label>
                    Дата по
                    <input type="date" id="filter-date-to">
                </label>
            </div>
        </section>

        <section class="transactions-section">
            <h2>История операций</h2>
            <div id="loader" class="loader hidden">
                <div class="spinner"></div>
            </div>
            <p id="empty-message" class="empty-message hidden">Пока нет ни одной операции 💭</p>
            <ul id="transactions-list" class="transactions"></ul>
        </section>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
